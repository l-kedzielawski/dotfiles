# =============== BASIC LOOK & FEEL ==================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Don't let ligatures blur the character under the cursor while editing
disable_ligatures cursor

# Truecolor / hyperlinks (Neovim/tokyonight)
allow_hyperlinks yes
# Detect URLs in output and style them so they're clickable
detect_urls yes
url_style curly

# Box drawing scaling (must have four values).
# Smaller first value = thinner lines in tmux/nvim. This is the default.
box_drawing_scale 0.001, 1, 1.5, 2

# Disable the annoying bell, but still flag the window on a bell event
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

# Scrollback
scrollback_lines 10000

# Slight transparency for cinematic feel
background_opacity 0.95

# Cursor - Neon Blue
cursor                  #7aa2f7
cursor_text_color       #1a1b26
cursor_shape block
cursor_blink_interval 0

# Windows / Tabs
remember_window_size  yes
initial_window_width  110c
initial_window_height 30c

# Padding
window_padding_width 6

# Don't nag when closing a window (opinionated)
confirm_os_window_close 0

# Behavior / performance (opinionated)
sync_to_monitor  yes
mouse_hide_wait  3.0
# cursor_trail 3        # nice motion effect; needs kitty >= 0.36, uncomment if supported

# =============== CLIPBOARD ==================
clipboard_control write-clipboard write-primary no-append

# =============== KEYBINDINGS ==================
# NOTE: tmux owns your splits/panes, so these are OS-window level only.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n     new_os_window
map ctrl+shift+w     close_window

# =============== TMUX AUTO-START ==================
# Attach to a session named "main" if it exists, otherwise create it.
# Prevents a new orphaned session on every Kitty window.
shell tmux new-session -A -s main

# =============== COLORS (tokyonight-ish) ==================
foreground   #c0caf5
background   #1a1b26
selection_foreground #c0caf5
selection_background #283457
color0   #15161e
color1   #f7768e
color2   #9ece6a
color3   #e0af68
color4   #7aa2f7
color5   #bb9af7
color6   #7dcfff
color7   #a9b1d6
color8   #414868
color9   #f7768e
color10  #9ece6a
color11  #e0af68
color12  #7aa2f7
color13  #bb9af7
color14  #7dcfff
color15  #c0caf5

mouse_map middle press grabbed,ungrabbed paste_from_selection
